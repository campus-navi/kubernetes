prometheus:
  prometheusSpec:
    retention: 2d

    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: 200m
        memory: 768Mi

grafana:
  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false
