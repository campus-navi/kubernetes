apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-deploy
  namespace: campus-navi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: ai
          image: 154959837798.dkr.ecr.ap-northeast-2.amazonaws.com/campus-navi-ai:ab610ba239ac120d1f638724bda4e49ad6bb1be0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-config
            - secretRef:
                name: ai-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10