apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-servicemonitor
  namespace: monitoring  
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - campus-navi          
  selector:
    matchLabels:
      app: backend        
  endpoints:
    - port: http          
      path: /actuator/prometheus
      interval: 15s
 